name: Instagram 예약 업로드

on:
  schedule:
    # 매일 오전 9시 (한국시간) = 00:00 UTC. GitHub 예약 실행은 몇 분~수십 분 늦을 수 있어요.
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "실제로 올리지 않고 테스트만 (1 = 테스트)"
        default: "0"

permissions:
  contents: write

concurrency:
  group: instagram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 게시물 업로드
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IMAGE_BASE_URL: ${{ vars.IMAGE_BASE_URL }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: python scripts/post.py

      - name: 업로드 기록 커밋
        run: |
          if git diff --quiet queue.json; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: 인스타 업로드 기록 [skip ci]"
          git push
